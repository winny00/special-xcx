# 管理后台：在 GitHub 云上构建，再 rsync 到 ECS。不要在 1.6G 生产机上跑 Jenkins/npm。
#
# 仓库 Settings → Secrets and variables → Actions 需要：
#   ECS_HOST       例：8.134.110.218
#   ECS_USERNAME   例：root
#   ECS_SSH_KEY    能登录 ECS 的私钥全文（含 BEGIN/END）
# ECS 安全组需放行来自公网的 22（GitHub-hosted runner 出口 IP 不固定）。
# 发布后请在 ECS 上 systemctl stop jenkins && systemctl disable jenkins

name: Deploy admin

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 手动发布管理后台
        required: false
        default: manual

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install and build
        working-directory: apps/admin
        run: |
          npm ci --no-audit --no-fund
          npx vite build

      - name: Deploy dist to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USERNAME: ${{ secrets.ECS_USERNAME }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${ECS_HOST:-}"
          test -n "${ECS_USERNAME:-}"
          test -n "${ECS_SSH_KEY:-}"
          KEY_FILE=$(mktemp)
          printf '%s\n' "$ECS_SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          FIRST=$(head -1 "$KEY_FILE")
          case "$FIRST" in
            -----BEGIN*) echo "SSH private key header looks OK" ;;
            *) echo "ECS_SSH_KEY must be the PRIVATE key (starts with -----BEGIN), not the .pub file"; exit 1 ;;
          esac
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          looks_like_key() {
            case "$1" in
              *BEGIN*|*PRIVATE*|*OPENSSH*|*END*KEY*) return 0 ;;
            esac
            [ "${#1}" -gt 64 ]
          }
          ECS_HOST=$(printf '%s' "$ECS_HOST" | tr -d '\r\n\t ' | sed $'s/\xef\xbb\xbf//g')
          ECS_USERNAME=$(printf '%s' "$ECS_USERNAME" | tr -d '\r\n\t ' | sed $'s/\xef\xbb\xbf//g')
          ECS_HOST="${ECS_HOST#\"}"; ECS_HOST="${ECS_HOST%\"}"
          ECS_HOST="${ECS_HOST#\'}"; ECS_HOST="${ECS_HOST%\'}"
          ECS_USERNAME="${ECS_USERNAME#\"}"; ECS_USERNAME="${ECS_USERNAME%\"}"
          ECS_USERNAME="${ECS_USERNAME#\'}"; ECS_USERNAME="${ECS_USERNAME%\'}"
          if looks_like_key "$ECS_HOST"; then
            echo "ECS_HOST secret is a private key, not an IP. Using 8.134.110.218. Please set ECS_HOST=8.134.110.218"
            ECS_HOST=8.134.110.218
          fi
          if looks_like_key "$ECS_USERNAME"; then
            echo "ECS_USERNAME secret is a private key, not a user. Using root. Please set ECS_USERNAME=root"
            ECS_USERNAME=root
          fi
          case "$ECS_USERNAME" in *@*) ECS_USERNAME="${ECS_USERNAME%%@*}" ;; esac
          case "$ECS_HOST" in *@*) ECS_HOST="${ECS_HOST##*@}" ;; esac
          case "$ECS_HOST" in *:*) ECS_HOST="${ECS_HOST%%:*}" ;; esac
          echo "SSH target ${ECS_USERNAME}@${ECS_HOST}"
          case "$ECS_HOST" in
            ''|*[!0-9A-Za-z.-]*)
              echo "ECS_HOST must be an IP or hostname only (example 8.134.110.218)"
              exit 1
              ;;
          esac
          ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${ECS_USERNAME}@${ECS_HOST}" \
            'rm -rf /var/www/admin && mkdir -p /var/www/admin'
          tar -C apps/admin/dist -czf - . | ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${ECS_USERNAME}@${ECS_HOST}" \
            'tar -C /var/www/admin -xzf -'
          rm -f "$KEY_FILE"

      - name: Verify login page
        run: |
          curl -sf -o /dev/null -w '%{http_code}' "http://8.134.110.218/login" | grep 200
