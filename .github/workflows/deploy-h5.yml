# 移动端 H5：在 GitHub 云上构建，再同步到 ECS /var/www/h5（Nginx /h5/）。
#
# Secrets（与 deploy-admin / deploy-server 相同）：
#   ECS_HOST, ECS_USERNAME, ECS_SSH_KEY

name: Deploy H5

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-h5.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 手动发布 H5
        required: false
        default: manual

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install and build
        working-directory: apps/mobile
        env:
          HUSKY: '0'
        run: |
          cp env/.env.production.example env/.env.production
          pnpm install --frozen-lockfile
          pnpm build:h5:prod

      - name: Deploy dist to ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USERNAME: ${{ secrets.ECS_USERNAME }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${ECS_HOST:-}"
          test -n "${ECS_USERNAME:-}"
          test -n "${ECS_SSH_KEY:-}"
          KEY_FILE=$(mktemp)
          printf '%s\n' "$ECS_SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          FIRST=$(head -1 "$KEY_FILE")
          case "$FIRST" in
            -----BEGIN*) echo "SSH private key header looks OK" ;;
            *) echo "ECS_SSH_KEY must be the PRIVATE key (starts with -----BEGIN), not the .pub file"; exit 1 ;;
          esac
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          looks_like_key() {
            case "$1" in
              *BEGIN*|*PRIVATE*|*OPENSSH*|*END*KEY*) return 0 ;;
            esac
            [ "${#1}" -gt 64 ]
          }
          ECS_HOST=$(printf '%s' "$ECS_HOST" | tr -d '\r\n\t ' | sed $'s/\xef\xbb\xbf//g')
          ECS_USERNAME=$(printf '%s' "$ECS_USERNAME" | tr -d '\r\n\t ' | sed $'s/\xef\xbb\xbf//g')
          ECS_HOST="${ECS_HOST#\"}"; ECS_HOST="${ECS_HOST%\"}"
          ECS_HOST="${ECS_HOST#\'}"; ECS_HOST="${ECS_HOST%\'}"
          ECS_USERNAME="${ECS_USERNAME#\"}"; ECS_USERNAME="${ECS_USERNAME%\"}"
          ECS_USERNAME="${ECS_USERNAME#\'}"; ECS_USERNAME="${ECS_USERNAME%\'}"
          if looks_like_key "$ECS_HOST"; then
            echo "ECS_HOST secret is a private key, not an IP. Using 8.134.110.218. Please set ECS_HOST=8.134.110.218"
            ECS_HOST=8.134.110.218
          fi
          if looks_like_key "$ECS_USERNAME"; then
            echo "ECS_USERNAME secret is a private key, not a user. Using root. Please set ECS_USERNAME=root"
            ECS_USERNAME=root
          fi
          case "$ECS_USERNAME" in *@*) ECS_USERNAME="${ECS_USERNAME%%@*}" ;; esac
          case "$ECS_HOST" in *@*) ECS_HOST="${ECS_HOST##*@}" ;; esac
          case "$ECS_HOST" in *:*) ECS_HOST="${ECS_HOST%%:*}" ;; esac
          echo "SSH target ${ECS_USERNAME}@${ECS_HOST}"
          case "$ECS_HOST" in
            ''|*[!0-9A-Za-z.-]*)
              echo "ECS_HOST must be an IP or hostname only (example 8.134.110.218)"
              exit 1
              ;;
          esac
          test -d apps/mobile/dist/build/h5
          ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${ECS_USERNAME}@${ECS_HOST}" \
            'rm -rf /var/www/h5 && mkdir -p /var/www/h5'
          tar -C apps/mobile/dist/build/h5 -czf - . | ssh -i "$KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${ECS_USERNAME}@${ECS_HOST}" \
            'tar -C /var/www/h5 -xzf -'
          rm -f "$KEY_FILE"

      - name: Verify H5
        run: |
          curl -sf -o /dev/null -w '%{http_code}' "http://8.134.110.218/h5/" | grep -E '200|304'
